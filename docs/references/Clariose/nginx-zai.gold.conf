# zai.gold — Clariose nginx configuration.
#
# Two upstreams:
#   • clariose_backend  (NestJS)    127.0.0.1:4000
#   • clariose_frontend (Nuxt SSR)  127.0.0.1:3000
#
# Enable: sudo ln -sf /home/ubuntu/Zai/nginx-zai.gold.conf /etc/nginx/sites-enabled/zai.gold
# Test:   sudo nginx -t
# Reload: sudo systemctl reload nginx

upstream clariose_backend {
    server 127.0.0.1:4400;
    keepalive 16;
}

upstream clariose_frontend {
    server 127.0.0.1:3300;
    keepalive 16;
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name zai.gold www.zai.gold;
    return 301 https://zai.gold$request_uri;
}

# ── www → apex redirect ────────────────────────────────────────────────────────
server {
    listen 15.204.89.42:443 ssl http2;
    listen [2604:2dc0:202:300::2c67]:443 ssl http2;
    server_name www.zai.gold;

    ssl_certificate     /etc/ssl/cloudflare/zai.gold.pem;
    ssl_certificate_key /etc/ssl/cloudflare/zai.gold.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL_ZAI_GOLD:10m;
    ssl_session_tickets off;

    add_header X-Site-Name "zai-gold-www-redirect" always;
    return 301 https://zai.gold$request_uri;
}

# ── Main site ──────────────────────────────────────────────────────────────────
server {
    listen 15.204.89.42:443 ssl http2;
    listen [2604:2dc0:202:300::2c67]:443 ssl http2;
    server_name zai.gold;

    ssl_certificate     /etc/ssl/cloudflare/zai.gold.pem;
    ssl_certificate_key /etc/ssl/cloudflare/zai.gold.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL_ZAI_GOLD2:10m;
    ssl_session_tickets off;

    add_header X-Site-Name             "zai.gold (clariose)"                  always;
    add_header X-Frame-Options         "SAMEORIGIN"                        always;
    add_header X-Content-Type-Options  "nosniff"                           always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"   always;
    # Microphone is required for /consult — deliberately allow self-origin.
    add_header Permissions-Policy      "camera=(), microphone=(self), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 8m;
    location ~ /\.(?!well-known) { deny all; }

    # ── API → NestJS ───────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://clariose_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering off;
    }

    # CLARIOSE_V01 §security — SSE endpoint authenticates via ?token=… because
    # EventSource can't send Authorization headers. Suppress access logs on
    # this exact path so the JWT doesn't end up in nginx logs.
    location ~ ^/api/visits/[^/]+/events$ {
        access_log off;
        proxy_pass         http://clariose_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # SSE specifics — keep the connection open well past nginx default.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout    24h;
    }

    # ── Nuxt build assets — immutable, cache 1 year ────────────────────────
    location /_nuxt/ {
        proxy_pass         http://clariose_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable" always;
    }

    # ── Static (favicon, robots, etc.) ─────────────────────────────────────
    location ~* \.(?:ico|svg|png|jpg|jpeg|gif|webp|woff2?|ttf|otf|json|txt|xml|map)$ {
        proxy_pass         http://clariose_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        expires 7d;
        access_log off;
        add_header Cache-Control "public" always;
    }

    # ── App (Nuxt SSR) ─────────────────────────────────────────────────────
    location / {
        proxy_pass         http://clariose_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
    }
}
