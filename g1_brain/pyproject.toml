[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "g1_brain"
version = "0.1.0"
description = "Slow Brain + Fast Reflex + Safe Skill agent for Unitree G1"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Helios" },
]

dependencies = [
  "aiohttp>=3.9",
  "mediapipe>=0.10",
  "numpy>=1.24",
  "opencv-python>=4.8",
  "openai>=1.30",
  "pydantic>=2.0",
  "pynput>=1.7",
  "pyyaml>=6.0",
  "scipy>=1.11",
  "sounddevice>=0.4",
  "twilio>=9.0",
  "ultralytics>=8.3",
  "webrtcvad>=2.0",
  "websockets>=12",
]

[project.optional-dependencies]
mono_depth = ["transformers>=4.40", "accelerate>=0.30"]
test = ["pytest>=7", "pytest-asyncio>=0.21"]

[tool.setuptools.packages.find]
where = ["."]
include = ["g1_brain*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: empirical physics gates that step real MuJoCo at ~real time",
]
